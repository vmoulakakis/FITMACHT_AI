name: FITMATCH staging checks
on:
  push:
    branches: [main, fitmatch-staging]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Python feed pipeline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-audit --no-fund
      - name: Commercial gates and API tests
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser journeys
        run: npm run test:e2e
      - name: Preserve test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitmatch-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
